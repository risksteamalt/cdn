<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Page</title>
</head>
<body>

    <!-- 1. PASTE YOUR SVG CODE HERE (It will be invisible) -->



  
    <svg xmlns="http://www.w3.org/2000/svg" style="display: none;">
      <defs>
        <symbol id="stickman-gta-city" viewBox="0 0 100 100">
          <circle cx="50" cy="20" r="8" fill="#333"/>
          <line x1="50" y1="28" x2="50" y2="60" stroke="#333" stroke-width="4"/>
          <line x1="30" y1="40" x2="70" y2="40" stroke="#333" stroke-width="4"/>
        </symbol>
        <symbol id="other-icon" viewBox="0 0 100 100">
          <!-- another art -->
        </symbol>
      </defs>
    </svg>

    <!-- 2. HOW TO DISPLAY THE ICON ANYWHERE ON YOUR PAGE -->
    <h1>Welcome to the City</h1>
    
    <!-- This summons your stickman -->
    <svg width="50" height="50">
        <use href="#stickman-gta-city"></use>
    </svg>

</body>
</html>
