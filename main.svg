<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     width="100%" height="100%" viewBox="0 0 1200 800"
     role="img" aria-label="Dern V2 UI as SVG">
  <title>Dern V2 UI (SVG)</title>

  <defs>
    <symbol id="stickman-gta-city" viewBox="0 0 100 100">
      <circle cx="50" cy="20" r="8" fill="#333"/>
      <line x1="50" y1="28" x2="50" y2="60" stroke="#333" stroke-width="4"/>
      <line x1="30" y1="40" x2="70" y2="40" stroke="#333" stroke-width="4"/>
    </symbol>

    <symbol id="other-icon" viewBox="0 0 100 100">
      <rect x="20" y="20" width="60" height="60" rx="10" fill="#666"/>
      <circle cx="50" cy="50" r="14" fill="#fff"/>
    </symbol>
  </defs>

  <rect width="100%" height="100%" fill="#000"/>

  <foreignObject x="0" y="0" width="100%" height="100%">
    <html xmlns="http://www.w3.org/1999/xhtml" lang="en">
      <head>
        <meta charset="utf-8"/>
        <meta name="viewport" content="width=device-width,initial-scale=1"/>
        <style>
          html,body { height:100%; width:100%; margin:0; padding:0; font-family: system-ui, -apple-system, "Segoe UI", Arial, sans-serif; background:transparent; color:#fff; }
          .navbar{position:fixed;top:0;left:0;width:100%;display:flex;justify-content:flex-end;gap:10px;padding:8px 18px;background:rgba(16,16,16,0.9);box-sizing:border-box;}
          .nav-link{color:#fff;text-decoration:none;padding:6px 10px;border-radius:6px;background:transparent;}
          .nav-link:hover{background:#fff;color:#000;}
          .dern-header{text-align:center;margin-top:56px;font-size:2.4rem;font-weight:400;}
          .main{display:flex;flex-direction:column;align-items:center;padding-top:12px;}
          .search{display:flex;width:520px;max-width:92vw;background:#fff;border-radius:14px;overflow:hidden;border:3px solid #17d917;box-shadow:0 0 7px #2fff5986,0 2px 12px rgba(0,0,0,.08);}
          .search input{flex:1;padding:14px;border:0;font-size:1.1rem;outline:none;}
          .search button{width:48px;border:0;background:#eee;cursor:pointer;}
          .shortcuts{display:flex;gap:16px;flex-wrap:wrap;margin-top:16px;justify-content:center;}
          .shortcut{width:80px;padding:12px;text-align:center;background:rgba(255,255,255,0.9);border-radius:10px;cursor:pointer;color:#000;}
          .shortcut img, .shortcut svg{width:32px;height:32px;display:inline-block;}
          .datetime{position:fixed;right:18px;bottom:18px;background:rgba(0,0,0,0.45);padding:10px 14px;border-radius:10px;font-size:0.95rem;}
        </style>
      </head>
      <body>
        <nav class="navbar">
          <a class="nav-link" href="socials.html">Socials</a>
          <a class="nav-link" href="games.html" target="_blank">Games</a>
          <a class="nav-link" href="changelog.html" target="_blank">Changelog</a>
        </nav>

        <div class="dern-header">Dern V2 (soon)</div>

        <main class="main">
          <form class="search" action="https://www.google.com/search" method="get" target="_blank" onsubmit="if(!this.q.value) return false;">
            <input name="q" type="text" placeholder="Search the web…" />
            <button type="submit" title="Search">🔍</button>
          </form>

          <div class="shortcuts">
            <div class="shortcut" onclick="window.open('https://www.google.com','_blank')">
              <img src="https://www.google.com/favicon.ico" alt="Google" /><br />Google
            </div>

            <div class="shortcut" onclick="window.open('https://example.com','_blank')" title="Stickman">
              <svg viewBox="0 0 100 100" width="36" height="36" aria-hidden="true">
                <use href="#stickman-gta-city" xlink:href="#stickman-gta-city"></use>
              </svg><br />Stickman
            </div>

            <div class="shortcut" onclick="window.open('https://www.youtube.com','_blank')">
              <svg viewBox="0 0 576 512" width="36" height="36" aria-hidden="true">
                <rect width="100%" height="100%" fill="#ff0000" rx="28" />
                <path d="M232 336V176l142 80-142 80z" fill="#fff" />
              </svg><br />YouTube
            </div>
          </div>
        </main>

        <div class="datetime" id="datetime">--:--:--</div>

        <script>
          function upd() {
            const d = new Date();
            document.getElementById('datetime').textContent = d.toLocaleTimeString();
          }
          upd();
          setInterval(upd, 1000);
        </script>
      </body>
    </html>
  </foreignObject>
</svg>
